server {
    listen 80;
    server_name _;

    root /var/www/backend/public;

    # Встроенный DNS Docker. Без него nginx резолвит имена сервисов один раз
    # при старте и отвечает 502, когда контейнер перезапустился с новым IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── WebSocket: клиенты Centrifugo ───────────────────────────────────
    # Наружу отдаём короткий /ws, внутрь ходим на штатный эндпоинт Centrifugo
    location /ws {
        set $centrifugo_upstream http://centrifugo:8000;
        proxy_pass $centrifugo_upstream/connection/websocket;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS-соединения долгие: не рвём их по таймауту чтения
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── HTTP API Symfony ────────────────────────────────────────────────
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           off;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Прямой вызов любого другого .php запрещён
    location ~ \.php$ {
        return 404;
    }

    # ── Всё остальное — Vite dev-server (React + HMR по WebSocket) ──────
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
}
