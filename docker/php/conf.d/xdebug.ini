; Xdebug 3. Режим берётся из переменной окружения XDEBUG_MODE (она у Xdebug
; в приоритете над ini): off — выключен, debug — пошаговая отладка,
; debug,develop — плюс расширенный var_dump и стек ошибок.
; Переключение: make xdebug-on / make xdebug-off (пересоздают контейнер php).
zend_extension = xdebug

xdebug.mode = off

; IDE слушает на хосте; имя резолвится через extra_hosts в docker-compose.yml
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Подключаться к IDE на каждом запросе, когда режим debug: для JSON-API,
; который дёргает React, ставить cookie-триггер неудобно. Если IDE не слушает,
; Xdebug сдаётся через connect_timeout_ms и запрос идёт дальше.
xdebug.start_with_request = yes
xdebug.connect_timeout_ms = 200
xdebug.idekey = PHPSTORM

; Отладочный вывод Xdebug — в лог контейнера, чтобы видеть, дошёл ли он до IDE
xdebug.log = /dev/stderr
xdebug.log_level = 3
