name: sketchboard

services:
  # ── Прокси: единственный порт, открытый наружу ──────────────────────────
  nginx:
    image: nginx:1-alpine
    container_name: sketchboard-nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      php:
        condition: service_started
      frontend:
        condition: service_started
      centrifugo:
        condition: service_started
    networks: [sketchboard]

  # ── PHP-FPM: Symfony (HTTP API) ─────────────────────────────────────────
  php:
    build:
      context: ./docker/php
      network: host
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: sketchboard-php:8.5-fpm-alpine
    container_name: sketchboard-php
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      REALTIME_CHANNEL: ${REALTIME_CHANNEL:-board:main}
      CENTRIFUGO_API_URL: "http://centrifugo:8000/api"
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_TOKEN_TTL: ${CENTRIFUGO_TOKEN_TTL:-3600}
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks: [sketchboard]

  # ── Centrifugo: WebSocket-сервер realtime-сообщений ────────────────────
  centrifugo:
    image: centrifugo/centrifugo:v6.9
    container_name: sketchboard-centrifugo
    command: ["centrifugo", "--config", "/etc/centrifugo/config.yaml"]
    environment:
      # Секреты держим в переменных окружения, а не в конфиге
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      # Браузер приходит через nginx, поэтому источник — адрес приложения
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:8080}
    volumes:
      - ./docker/centrifugo/config.yaml:/etc/centrifugo/config.yaml:ro
    # Centrifugo работает от непривилегированного пользователя и требует
    # увеличенного лимита дескрипторов под тысячи соединений
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sketchboard]

  # ── Frontend: Vite dev-server с HMR ─────────────────────────────────────
  frontend:
    build:
      context: ./docker/node
      network: host
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: sketchboard-frontend
    environment:
      # Пути относительные — фронт ходит через nginx, тот же origin
      VITE_API_BASE: /api
      VITE_WS_PATH: /ws
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [sketchboard]

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: sketchboard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # В PostgreSQL 18 данные лежат в подкаталоге /var/lib/postgresql,
      # монтировать нужно именно этот путь, а не .../data
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sketchboard]

  # ── Redis: кэш Symfony + шина Pub/Sub для realtime ──────────────────────
  redis:
    image: redis:8-alpine
    container_name: sketchboard-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sketchboard]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  sketchboard:
    driver: bridge
    driver_opts:
      # MTU по умолчанию (1500) больше, чем у VPN-интерфейса на многих
      # рабочих машинах — исходящие соединения из контейнеров зависают.
      # Переопределяется переменной DOCKER_MTU в .env
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1420}
