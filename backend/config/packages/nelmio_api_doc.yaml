# Документация API (только dev): Swagger UI на /api/doc, спецификация — /api/doc.json.
# Операции описаны атрибутами OpenApi на контроллерах; здесь — то, что общее для
# многих операций: сведения об API и переиспользуемые схемы ответов.
# Схемы держим тут, а не атрибутами на read-моделях, чтобы слой Application
# не зависел от библиотеки документации. Меняя NoteView/DrawingView — правьте и их.
when@dev:
    nelmio_api_doc:
        html_config:
            # Ассеты Swagger UI с CDN: nginx отдаёт из public только /api, а
            # раскладывать bundles/ в bind-mount ради UI не хочется
            assets_mode: cdn

        areas:
            default:
                path_patterns:
                    - ^/api(?!/doc(\.json)?$)

        documentation:
            info:
                title: Sketchboard API
                version: 0.1.0
                description: |
                    Realtime-доска заметок. HTTP API покрывает команды и чтение;
                    изменения доставляются всем участникам через WebSocket (Centrifugo),
                    подключение к которому выдаёт `GET /api/realtime/access`.

                    Нарушение доменных правил — `422` с полем и текстом ошибки,
                    отсутствующая заметка или файл — `404`, чужой приватный файл — `403`.
                    Авторизации нет: имя участника приходит от клиента и ничем не
                    подтверждается — в том числе `requester` у маршрутов файлов.
            tags:
                - name: Заметки
                  description: Стикеры на общей доске
                - name: Рисунок
                  description: Доска для рисования, прикреплённая к заметке
                - name: Файлы
                  description: Публичные и приватные файлы в хранилище S3
                - name: Realtime
                  description: Доступ к WebSocket-каналу
                - name: Диагностика
            components:
                schemas:
                    Note:
                        type: object
                        required: [id, text, x, y, color, author, createdAt]
                        properties:
                            id: { type: string, format: uuid, example: 01a08a63-e792-7a84-ac0f-129ad0bcfb42 }
                            text: { type: string, maxLength: 2000, example: Купить молоко }
                            x: { type: integer, minimum: 0, maximum: 10000, example: 120 }
                            y: { type: integer, minimum: 0, maximum: 10000, example: 80 }
                            color: { type: string, pattern: '^#[0-9a-f]{6}$', example: '#ffd166' }
                            author: { type: string, maxLength: 64, example: гость-451 }
                            createdAt: { type: string, format: date-time, example: '2026-09-10T08:16:38+00:00' }
                    DrawingElement:
                        type: object
                        description: >-
                            Элемент сцены Excalidraw (rectangle, ellipse, diamond, line, arrow, freedraw, text, frame…)
                            в формате самого редактора. Сервер хранит его как есть и проверяет только
                            идентификатор, тип, размер и отсутствие признака удаления. Картинки (`image`)
                            не принимаются: их файлы хранятся вне сцены.
                        required: [id, type]
                        additionalProperties: true
                        properties:
                            id: { type: string, maxLength: 64, example: 7d1e0c7a2f3e4f0b9c1a }
                            type: { type: string, pattern: '^[a-z]{1,32}$', example: freedraw, description: 'Любой тип элемента Excalidraw, кроме image' }
                            isDeleted: { type: boolean, enum: [false], description: 'Удалённые элементы клиент отбрасывает до отправки' }
                            points:
                                type: array
                                maxItems: 20000
                                description: Точки штриха или ломаной относительно x, y элемента
                                items: { type: array, items: { type: number, format: double }, minItems: 2, maxItems: 2 }
                            version: { type: integer, example: 3, description: 'Счётчик правок элемента, ведёт Excalidraw' }
                    Drawing:
                        type: object
                        required: [noteId, elements, updatedAt]
                        properties:
                            noteId: { type: string, format: uuid }
                            elements:
                                type: array
                                description: Элементы сцены Excalidraw в порядке наложения
                                maxItems: 5000
                                items: { $ref: '#/components/schemas/DrawingElement' }
                            updatedAt:
                                type: string
                                format: date-time
                                nullable: true
                                description: null, если на заметке ещё не рисовали
                    File:
                        type: object
                        required: [id, name, mimeType, size, visibility, owner, url, uploadedAt]
                        properties:
                            id: { type: string, format: uuid, example: 01a08a63-e792-7a84-ac0f-129ad0bcfb42 }
                            name: { type: string, maxLength: 255, example: схема.png, description: 'Имя, каким его загрузили' }
                            mimeType:
                                type: string
                                enum: [image/png, image/jpeg, image/gif, image/webp, image/svg+xml, application/pdf, text/plain]
                                example: image/png
                            size: { type: integer, minimum: 1, maximum: 10485760, example: 48213, description: Размер в байтах }
                            visibility: { type: string, enum: [public, private] }
                            owner: { type: string, maxLength: 64, example: гость-451 }
                            url:
                                type: string
                                nullable: true
                                example: /files/2026/11/01a08a63-e792-7a84-ac0f-129ad0bcfb42.png
                                description: Прямая ссылка на публичный файл; у приватного — null
                            uploadedAt: { type: string, format: date-time, example: '2026-11-04T12:00:00+00:00' }
                    RealtimeAccess:
                        type: object
                        required: [token, channel, expiresAt]
                        properties:
                            token: { type: string, description: JWT для подключения к Centrifugo }
                            channel: { type: string, example: 'board:main' }
                            expiresAt: { type: string, format: date-time }
                    Health:
                        type: object
                        required: [status, php, symfony, postgres, redis, centrifugo, garage]
                        properties:
                            status: { type: string, enum: [ok, degraded] }
                            php: { type: string, example: 8.5.10 }
                            symfony: { type: string, example: 8.1.6 }
                            postgres: { type: string, example: ok, description: '`ok` или `error: …`' }
                            redis: { type: string, example: ok }
                            centrifugo: { type: string, example: ok }
                            garage: { type: string, example: ok }
                    ValidationError:
                        type: object
                        description: Нарушено правило домена; ключ — имя поля
                        required: [errors]
                        properties:
                            errors:
                                type: object
                                additionalProperties: { type: string }
                                example: { text: Текст заметки не может быть пустым }
                    NotFoundError:
                        type: object
                        required: [error]
                        properties:
                            error: { type: string, example: Заметка 01a08a63-e792-7a84-ac0f-129ad0bcfb42 не найдена }
                    ErrorMessage:
                        type: object
                        required: [error]
                        properties:
                            error: { type: string }
                parameters:
                    Requester:
                        name: requester
                        in: query
                        required: false
                        description: 'Имя участника, от чьего лица запрос; без него — anonymous'
                        schema: { type: string, maxLength: 64, example: гость-451 }
                responses:
                    ValidationError:
                        description: Нарушено правило домена
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/ValidationError' }
                    NoteNotFound:
                        description: Заметка не найдена
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/NotFoundError' }
                    FileNotFound:
                        description: Файл не найден
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/NotFoundError' }
                    FileAccessDenied:
                        description: Файл приватный, а запрос не от владельца
                        content:
                            application/json:
                                schema:
                                    allOf: [{ $ref: '#/components/schemas/ErrorMessage' }]
                                    example: { error: Доступ к файлу 01a08a63-e792-7a84-ac0f-129ad0bcfb42 запрещён }
                    StorageUnavailable:
                        description: Хранилище файлов не отвечает; подробности — в логе бэкенда
                        content:
                            application/json:
                                schema:
                                    allOf: [{ $ref: '#/components/schemas/ErrorMessage' }]
                                    example: { error: Хранилище файлов недоступно }
