doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            note_id: App\Infrastructure\Persistence\Doctrine\Type\NoteIdType
            note_text: App\Infrastructure\Persistence\Doctrine\Type\NoteTextType
            note_color: App\Infrastructure\Persistence\Doctrine\Type\ColorType
            note_author: App\Infrastructure\Persistence\Doctrine\Type\AuthorType

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        controller_resolver:
            auto_mapping: false
        mappings:
            # XML, а не атрибуты: доменные классы не должны знать про Doctrine
            Domain:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Domain'
                alias: Domain

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
